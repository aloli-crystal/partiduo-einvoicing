# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CI de partiduo-einvoicing (extension EINV, ADR-004) : format, Ameba, specs
# sur PostgreSQL (cœur, DOCUMENT, interface et extension, migrations
# comprises) contre la plateforme agréée simulée.
# Non exécutée tant que les dépôts ne sont pas publiés (BLOCAGES B-002).
name: CI

on:
  push:
    branches: [development, production]
  pull_request:

env:
  CRYSTAL_VERSION: "1.19.1"
  SKIP_MARTEN_CLI_PRECOMPILATION: "1"

jobs:
  qualite:
    name: Format, Ameba
    runs-on: ubuntu-latest
    container: crystallang/crystal:1.19.1
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances path (cœur, interface, shards maison)
        run: scripts/ci-checkout-deps.sh
      - name: Aucune mention du logiciel d'origine hors documentation
        # Motif écrit « noal[y]ss » pour que ce fichier ne se trouve pas lui-même.
        run: |
          if git grep -il 'noal[y]ss' -- . ':!*.adoc' ':!*.md'; then
            echo "Le nom du logiciel d'origine n'est admis que dans les fichiers .adoc et .md." >&2
            exit 1
          fi
      - name: Format
        run: crystal tool format --check src ui spec config scripts manage.cr
      - name: Shards
        run: shards install
      - name: Ameba
        run: mkdir -p bin && crystal build lib/ameba/bin/ameba.cr -o bin/ameba && bin/ameba

  specs:
    name: Specs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: partiduo
          POSTGRES_PASSWORD: partiduo
          POSTGRES_DB: partiduo_test
        options: >-
          --health-cmd "pg_isready -U partiduo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # En CI seulement, PostgreSQL est un service joignable en TCP.
      DATABASE_URL: postgres://partiduo:partiduo@localhost:5432/partiduo_test
    steps:
      - uses: actions/checkout@v4
      - name: Mémoire d'échange (la compilation des specs dépasse 6 Go)
        run: |
          sudo fallocate -l 12G /swap-ci && sudo chmod 600 /swap-ci
          sudo mkswap /swap-ci && sudo swapon /swap-ci && free -h
      - name: Index des paquets à jour (install-crystal installe sans le rafraîchir)
        run: sudo apt-get update
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1
      - name: Bibliothèques de compilation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libyaml-dev libssl-dev libgmp-dev libxml2-dev libpcre2-dev lld
      - name: Dépendances path (cœur, interface, shards maison)
        run: scripts/ci-checkout-deps.sh
      - name: Shards
        run: shards install
      - name: Specs
        run: crystal spec --order random --no-debug --threads 1 --link-flags=-fuse-ld=lld
